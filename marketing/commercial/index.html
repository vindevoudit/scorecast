<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bantryx — The Rating Engine</title>
    <meta
      name="description"
      content="Bantryx rating-engine commercial — 333 national teams rated from 49,215 matches of football history."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=block"
      rel="stylesheet"
    />

    <style>
      :root {
        --navy0: #020617;
        --navy1: #0f172a;
        --elevated: #0b1321;
        --cyan: #22d3ee;
        --cyan-deep: #06b6d4;
        --cyan-soft: #67e8f9;
        --amber: #f59e0b;
        --violet: #a855f7;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --dim: #475569;
        --glow-strong:
          0 0 14px rgba(34, 211, 238, 0.7), 0 0 28px rgba(34, 211, 238, 0.45),
          0 0 56px rgba(34, 211, 238, 0.25), 0 0 96px rgba(34, 211, 238, 0.12);
        --glow-soft: 0 0 8px rgba(34, 211, 238, 0.55), 0 0 18px rgba(34, 211, 238, 0.3);
        --led: 0 0 6px rgba(34, 211, 238, 0.5), 0 0 12px rgba(34, 211, 238, 0.25);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        background: var(--navy0);
        color: var(--fg);
        font-family: 'Inter', system-ui, sans-serif;
      }

      /* Fallback backdrop that matches the app before WebGL takes over. */
      #stage {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.45) 100%),
          radial-gradient(circle at 50% 22%, rgba(6, 182, 212, 0.16), transparent 45%),
          linear-gradient(160deg, #0f172a, #020617 70%);
      }

      #canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ------- caption overlay ------- */
      #overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .cap {
        position: absolute;
        opacity: 0;
        transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      .cap.on {
        opacity: 1;
      }

      /* center helper */
      .cx {
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        width: min(1100px, 92vw);
      }

      #cap-sub {
        top: 7%;
        letter-spacing: 0.42em;
        font: 600 clamp(0.6rem, 1.4vw, 0.9rem) 'Inter';
        color: var(--cyan);
        text-transform: uppercase;
      }
      #cap-sub::before,
      #cap-sub::after {
        content: '◆';
        color: rgba(34, 211, 238, 0.4);
        margin: 0 0.7em;
        font-size: 0.7em;
        vertical-align: middle;
      }

      #cap-wordmark {
        top: 43%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Orbitron', monospace;
        font-weight: 900;
        letter-spacing: 0.28em;
        color: var(--cyan-soft);
        font-size: clamp(2.4rem, 9vw, 7.5rem);
        line-height: 0.9;
        text-shadow: var(--glow-strong);
        white-space: nowrap;
      }
      #cap-wordmark.on {
        opacity: var(--ignite, 1);
        filter: blur(calc((1 - var(--ignite, 1)) * 10px));
      }
      #cap-wordmark.mega {
        font-size: clamp(2.8rem, 12vw, 9.5rem);
      }

      #cap-kicker {
        top: 61%;
        left: 50%;
        transform: translateX(-50%);
        letter-spacing: 0.5em;
        font: 600 clamp(0.65rem, 1.6vw, 1rem) 'Inter';
        color: var(--cyan);
        text-transform: uppercase;
      }
      #cap-kicker.on {
        opacity: var(--fade, 1);
      }

      #cap-stat {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: min(1100px, 94vw);
      }
      #cap-stat .num {
        font-family: 'Orbitron', monospace;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        color: var(--cyan-soft);
        font-size: clamp(3.2rem, 15vw, 12rem);
        line-height: 0.95;
        text-shadow: var(--glow-strong);
      }
      #cap-stat .label {
        margin-top: 0.8rem;
        letter-spacing: 0.34em;
        font: 600 clamp(0.7rem, 1.7vw, 1.05rem) 'Inter';
        color: var(--muted);
        text-transform: uppercase;
      }
      #cap-stat.pop .num {
        animation: pop 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes pop {
        0% {
          transform: scale(0.8);
          filter: blur(6px);
          opacity: 0.3;
        }
        100% {
          transform: scale(1);
          filter: blur(0);
          opacity: 1;
        }
      }

      /* ------- leaderboard panel ------- */
      #cap-lead {
        right: 5vw;
        top: 50%;
        transform: translateY(-50%);
        width: min(400px, 40vw);
        padding: 1.3rem 1.4rem;
        border-radius: 1.5rem;
        background: rgba(11, 19, 33, 0.62);
        border: 1px solid rgba(34, 211, 238, 0.16);
        box-shadow:
          0 20px 60px rgba(6, 182, 212, 0.14),
          inset 0 0 0 1px rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(10px);
      }
      .lead-head {
        letter-spacing: 0.3em;
        font: 700 0.68rem 'Inter';
        color: var(--cyan);
        text-transform: uppercase;
        margin-bottom: 0.9rem;
        padding-bottom: 0.7rem;
        border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      }
      .lead-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.42rem 0;
        opacity: var(--on, 0);
        transform: translateX(calc((1 - var(--on, 0)) * 22px));
      }
      .lead-row .rk {
        flex: 0 0 auto;
        width: 1.9rem;
        height: 1.9rem;
        display: grid;
        place-items: center;
        border-radius: 0.6rem;
        font:
          800 0.95rem 'Orbitron',
          monospace;
        font-variant-numeric: tabular-nums;
        color: var(--navy0);
        background: rgba(148, 163, 184, 0.18);
      }
      .lead-row .rk-1 {
        background: #facc15;
        box-shadow: var(--led);
      }
      .lead-row .rk-2 {
        background: #cbd5e1;
      }
      .lead-row .rk-3 {
        background: #d97706;
      }
      .lead-row .rk-n {
        color: var(--cyan-soft);
        background: rgba(34, 211, 238, 0.12);
      }
      .lead-row .nm {
        flex: 1 1 auto;
        font: 700 clamp(0.9rem, 1.5vw, 1.1rem) 'Inter';
        color: var(--fg);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .lead-row .elo {
        flex: 0 0 auto;
        font-family: 'Orbitron', monospace;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        color: var(--cyan-soft);
        font-size: clamp(1rem, 1.7vw, 1.25rem);
        text-shadow: var(--led);
      }

      /* ------- fixture card ------- */
      #cap-fixture {
        bottom: 8vh;
        left: 50%;
        transform: translateX(-50%);
        width: min(560px, 92vw);
        padding: 1.5rem 1.7rem;
        border-radius: 1.6rem;
        background: rgba(11, 19, 33, 0.66);
        border: 1px solid rgba(34, 211, 238, 0.18);
        box-shadow: 0 24px 70px rgba(6, 182, 212, 0.18);
        backdrop-filter: blur(12px);
      }
      .fx-eyebrow {
        letter-spacing: 0.34em;
        font: 700 0.68rem 'Inter';
        color: var(--cyan);
        text-transform: uppercase;
        text-align: center;
      }
      .fx-match {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        margin: 0.7rem 0 1.2rem;
      }
      .fx-team {
        font: 800 clamp(1.3rem, 3.4vw, 2rem) 'Inter';
        color: var(--fg);
      }
      .fx-vs {
        font-family: 'Orbitron', monospace;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: var(--cyan);
        font-size: clamp(0.9rem, 2vw, 1.15rem);
        text-shadow: var(--led);
      }
      .fx-bar {
        display: grid;
        grid-template-columns: 6.5rem 1fr 3rem;
        align-items: center;
        gap: 0.8rem;
        margin: 0.5rem 0;
      }
      .fx-lab {
        font: 600 0.82rem 'Inter';
        color: var(--muted);
        text-align: right;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fx-track {
        height: 0.85rem;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.12);
        overflow: hidden;
      }
      .fx-fill {
        display: block;
        height: 100%;
        width: 0%;
        border-radius: 999px;
        transition: width 0.12s linear;
      }
      .fx-fill.home {
        background: linear-gradient(90deg, var(--cyan-deep), var(--cyan));
        box-shadow: var(--led);
      }
      .fx-fill.draw {
        background: linear-gradient(90deg, #b45309, var(--amber));
      }
      .fx-fill.away {
        background: linear-gradient(90deg, #7c3aed, var(--violet));
      }
      .fx-pct {
        font-family: 'Orbitron', monospace;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        font-size: 0.95rem;
        text-align: right;
      }
      .fx-pct.home {
        color: var(--cyan-soft);
      }
      .fx-pct.draw {
        color: var(--amber);
      }
      .fx-pct.away {
        color: var(--violet);
      }
      .fx-chips {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
        margin-top: 1rem;
        flex-wrap: wrap;
      }
      .fx-chips span {
        font: 700 0.62rem 'Inter';
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0.32rem 0.7rem;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.18);
      }
      .fx-chips span.k {
        color: var(--navy0);
        background: var(--cyan);
        border-color: transparent;
        box-shadow: var(--glow-soft);
      }

      /* ------- CTA ------- */
      #cap-cta {
        top: 61%;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        width: min(900px, 92vw);
      }
      #cap-cta.on {
        opacity: var(--on, 1);
      }
      #cap-cta .mark {
        font-family: 'Orbitron', monospace;
        font-weight: 600;
        letter-spacing: 0.34em;
        color: var(--cyan-soft);
        font-size: clamp(0.8rem, 2vw, 1.15rem);
        text-shadow: var(--glow-soft);
      }
      #cap-cta .tag {
        margin-top: 0.9rem;
        letter-spacing: 0.28em;
        font: 500 clamp(0.6rem, 1.4vw, 0.85rem) 'Inter';
        color: var(--muted);
        text-transform: uppercase;
      }
      #cap-cta .url {
        margin-top: 0.5rem;
        font-family: 'Orbitron', monospace;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--cyan-soft);
        font-size: clamp(1.1rem, 2.6vw, 1.8rem);
        text-shadow: var(--led);
      }

      /* ------- source chip (persistent) ------- */
      #cap-source {
        position: fixed;
        left: 1.4rem;
        bottom: 1.1rem;
        font: 600 0.6rem 'Inter';
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(148, 163, 184, 0.55);
        pointer-events: none;
      }
      #cap-source b {
        color: var(--cyan-deep);
      }

      /* ------- controls + play gate ------- */
      #controls {
        position: fixed;
        right: 1.2rem;
        bottom: 1.1rem;
        display: flex;
        gap: 0.5rem;
        z-index: 5;
      }
      #controls button {
        pointer-events: auto;
        cursor: pointer;
        font: 600 0.72rem 'Inter';
        letter-spacing: 0.06em;
        color: var(--cyan-soft);
        background: rgba(11, 19, 33, 0.7);
        border: 1px solid rgba(34, 211, 238, 0.25);
        border-radius: 999px;
        padding: 0.5rem 0.9rem;
        backdrop-filter: blur(8px);
      }
      #controls button:hover {
        border-color: var(--cyan);
        box-shadow: var(--glow-soft);
      }

      #playgate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 45%, rgba(6, 182, 212, 0.1), transparent 55%),
          rgba(2, 6, 23, 0.72);
        backdrop-filter: blur(4px);
        transition: opacity 0.5s ease;
      }
      #playgate.hide {
        opacity: 0;
        pointer-events: none;
      }
      .play-inner {
        text-align: center;
      }
      .play-inner .pw {
        font-family: 'Orbitron', monospace;
        font-weight: 900;
        letter-spacing: 0.3em;
        color: var(--cyan-soft);
        font-size: clamp(2rem, 8vw, 5rem);
        text-shadow: var(--glow-strong);
      }
      .play-inner .pt {
        margin-top: 0.6rem;
        letter-spacing: 0.4em;
        font: 600 0.75rem 'Inter';
        color: var(--cyan);
        text-transform: uppercase;
      }
      #playbtn {
        margin-top: 2rem;
        cursor: pointer;
        font: 700 0.95rem 'Inter';
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--navy0);
        background: linear-gradient(90deg, var(--cyan-deep), var(--cyan-soft));
        border: none;
        border-radius: 999px;
        padding: 1rem 2.4rem;
        box-shadow: var(--glow-strong);
      }
      #playbtn:hover {
        transform: translateY(-1px);
      }
      #err {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        place-items: center;
        padding: 2rem;
        text-align: center;
        color: var(--muted);
        font: 500 0.95rem 'Inter';
        background: rgba(2, 6, 23, 0.9);
      }

      @media (max-width: 720px) {
        #cap-lead {
          right: 50%;
          transform: translate(50%, -50%);
          width: min(440px, 92vw);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cap {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="stage"></div>
    <canvas id="canvas"></canvas>

    <div id="overlay">
      <div id="cap-sub" class="cap cx"></div>
      <div id="cap-wordmark" class="cap">BANTRYX</div>
      <div id="cap-kicker" class="cap"></div>
      <div id="cap-stat" class="cap">
        <div class="num">0</div>
        <div class="label"></div>
      </div>
      <div id="cap-lead" class="cap"></div>
      <div id="cap-fixture" class="cap"></div>
      <div id="cap-cta" class="cap">
        <div class="mark"></div>
        <div class="tag"></div>
        <div class="url"></div>
      </div>
    </div>

    <div id="cap-source"></div>

    <div id="controls">
      <button id="replaybtn" title="Replay">↻ Replay</button>
      <button id="fsbtn" title="Fullscreen">⛶ Fullscreen</button>
    </div>

    <div id="playgate">
      <div class="play-inner">
        <div class="pw">BANTRYX</div>
        <div class="pt">The Rating Engine</div>
        <button id="playbtn">▶ Play the film</button>
      </div>
    </div>

    <div id="err">
      <div>
        This showpiece needs WebGL + a served origin.<br />Run
        <code>npx serve marketing/commercial</code> and open it over http://localhost.
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import { createWorld } from './scene.js';
      import { runCommercial } from './timeline.js';

      const canvas = document.getElementById('canvas');
      const gate = document.getElementById('playgate');
      const errBox = document.getElementById('err');
      let controller = null;
      let data = null;

      function showErr(msg) {
        errBox.style.display = 'grid';
        if (msg) errBox.firstElementChild.innerHTML = msg;
      }

      async function boot() {
        try {
          data = await fetch('./commercial-data.json').then((r) => {
            if (!r.ok) throw new Error('data ' + r.status);
            return r.json();
          });
        } catch (e) {
          showErr(
            'Could not load commercial-data.json — run <code>node fetch-data.mjs</code> first.',
          );
          return;
        }
        // source chip
        const d = new Date(data.generatedAt);
        const stamp = isNaN(d) ? '' : ' · ' + d.toISOString().slice(0, 10);
        document.getElementById('cap-source').innerHTML =
          `<b>${data.source === 'live-prod' ? 'LIVE PRODUCTION DATA' : 'DATA'}</b>${stamp}`;

        try {
          await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 2500))]);
        } catch {
          /* fonts best-effort */
        }
      }

      function start() {
        if (controller) return;
        let world;
        try {
          world = createWorld(canvas, data);
        } catch (e) {
          showErr('WebGL failed to initialise: ' + e.message);
          return;
        }
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        controller = runCommercial(world, data, { reducedMotion: reduced });
      }

      document.getElementById('playbtn').addEventListener('click', () => {
        if (!data) return;
        gate.classList.add('hide');
        start();
      });
      document.getElementById('replaybtn').addEventListener('click', () => {
        if (controller) controller.replay();
      });
      document.getElementById('fsbtn').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      });

      boot();
    </script>
  </body>
</html>
